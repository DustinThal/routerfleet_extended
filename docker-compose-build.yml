version: '3'
services:
  routerfleet:
    image: ghcr.io/dustinthal/routerfleet:latest
    build:
      context: .

  routerfleet-cron:
    image: ghcr.io/dustinthal/routerfleet-cron:latest
    build:
      context: ./containers/cron
      dockerfile: Dockerfile-cron

  routerfleet-monitoring:
    image: ghcr.io/dustinthal/routerfleet-monitoring:latest
    build:
      context: ./containers/monitoring
      dockerfile: Dockerfile-monitoring

  routerfleet-nginx:
    image: ghcr.io/dustinthal/routerfleet-nginx:latest
    build:
      context: ./containers/nginx
      dockerfile: Dockerfile-nginx
