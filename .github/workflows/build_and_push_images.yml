name: Build and push docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push routerfleet
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dustinthal/routerfleet:latest

      - name: Build and push routerfleet-cron
        uses: docker/build-push-action@v6
        with:
          context: ./containers/cron
          file: ./containers/cron/Dockerfile-cron
          push: true
          tags: ghcr.io/dustinthal/routerfleet-cron:latest

      - name: Build and push routerfleet-monitoring
        uses: docker/build-push-action@v6
        with:
          context: ./containers/monitoring
          file: ./containers/monitoring/Dockerfile-monitoring
          push: true
          tags: ghcr.io/dustinthal/routerfleet-monitoring:latest

      - name: Build and push routerfleet-nginx
        uses: docker/build-push-action@v6
        with:
          context: ./containers/nginx
          file: ./containers/nginx/Dockerfile-nginx
          push: true
          tags: ghcr.io/dustinthal/routerfleet-nginx:latest
